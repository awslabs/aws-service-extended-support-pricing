name: Pricing correction
description: Report a rate, tier, or region that looks wrong
title: "[correction]: "
labels: ["correction"]
body:
  - type: input
    id: entry
    attributes:
      label: Which entry
      description: serviceCode / engine / region, plus instance family or node type if applicable (engine can be null)
      placeholder: "docdb / null / us-east-1 / r5"
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current value in the dataset
      placeholder: "0.10 per vCPU-hour (year1_2)"
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Correct value
      placeholder: "0.1108 per vCPU-hour (year1_2)"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where you found the correct value
      description: The AWS Price List API (preferred; paste the filters you used) or a link to the AWS pricing page. The pricing page can lag the Price List for new regions.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
